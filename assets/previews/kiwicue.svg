    <rect x="142" y="118" width="106" height="30" rx="15" fill="#263747"/>
    <text x="162" y="139" fill="#7ee7d6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Remind me</text>
  </g>
  <g transform="translate(762 230)">
    <rect width="286" height="176" rx="26" fill="url(#card)" stroke="#243642"/>
    <rect x="26" y="26" width="92" height="92" rx="22" fill="#402032"/>
    <path d="M53 94 L74 49 L95 94 Z" fill="#f48fb1"/>
    <text x="142" y="58" fill="#edf7f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Night market</text>
    <text x="142" y="91" fill="#9fb3bd" font-family="Inter, Arial, sans-serif" font-size="16">Sat · Ponsonby</text>
    <rect x="142" y="118" width="90" height="30" rx="15" fill="#342034"/>
    <text x="164" y="139" fill="#f8a9c5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Saved</text>
  </g>
  <g transform="translate(438 446)">
