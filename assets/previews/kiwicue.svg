    <rect width="286" height="176" rx="26" fill="url(#card)" stroke="#243642"/>
    <rect x="26" y="26" width="92" height="92" rx="22" fill="#223545"/>
    <circle cx="72" cy="72" r="32" fill="#7ee7d6" opacity="0.9"/>
    <text x="142" y="58" fill="#edf7f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Laneway set</text>
