    <text x="34" y="94" fill="#9fb3bd" font-family="Inter, Arial, sans-serif" font-size="17">Search, categories, event source, reminders, and deployment notes.</text>
    <rect x="34" y="124" width="90" height="30" rx="15" fill="#152b33"/>
    <text x="55" y="145" fill="#7ee7d6" font-family="Inter, Arial, sans-serif" font-size="13">API</text>
    <rect x="138" y="124" width="122" height="30" rx="15" fill="#1a2330"/>
    <text x="159" y="145" fill="#aebdff" font-family="Inter, Arial, sans-serif" font-size="13">TypeScript</text>
    <rect x="274" y="124" width="96" height="30" rx="15" fill="#342034"/>
    <text x="295" y="145" fill="#f8a9c5" font-family="Inter, Arial, sans-serif" font-size="13">Vercel</text>
