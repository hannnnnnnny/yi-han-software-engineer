<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">KiwiCue event discovery interface preview</title>
  <desc id="desc">Dark themed event discovery dashboard with Auckland event cards, search filters, and reminder states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061116"/>
      <stop offset="0.56" stop-color="#101622"/>
      <stop offset="1" stop-color="#1d1020"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#16222c"/>
      <stop offset="1" stop-color="#0e151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7ee7d6"/>
      <stop offset="1" stop-color="#f48fb1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="975" cy="105" r="210" fill="#7ee7d6" opacity="0.12"/>
  <circle cx="140" cy="650" r="260" fill="#f48fb1" opacity="0.12"/>
  <rect x="78" y="70" width="1044" height="620" rx="34" fill="#080d12" opacity="0.78" filter="url(#shadow)"/>
  <rect x="118" y="112" width="964" height="90" rx="24" fill="#111922"/>
  <text x="154" y="167" fill="#edf7f5" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">KiwiCue</text>
  <text x="330" y="165" fill="#9fb3bd" font-family="Inter, Arial, sans-serif" font-size="20">Auckland events, sorted.</text>
  <rect x="790" y="132" width="120" height="38" rx="19" fill="#172b33" stroke="#29444f"/>
  <text x="816" y="157" fill="#7ee7d6" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Tonight</text>
  <rect x="928" y="132" width="116" height="38" rx="19" fill="#2b1724" stroke="#573146"/>
  <text x="956" y="157" fill="#f8a9c5" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Saved</text>
  <rect x="118" y="230" width="280" height="392" rx="28" fill="#101820" stroke="#20323d"/>
  <text x="154" y="278" fill="#edf7f5" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Find events</text>
  <rect x="154" y="315" width="208" height="42" rx="15" fill="#0b1218" stroke="#28404b"/>
  <text x="178" y="342" fill="#94a7b1" font-family="Inter, Arial, sans-serif" font-size="16">music, markets...</text>
  <rect x="154" y="382" width="88" height="34" rx="17" fill="#163039"/>
  <text x="177" y="405" fill="#7ee7d6" font-family="Inter, Arial, sans-serif" font-size="14">Music</text>
  <rect x="252" y="382" width="94" height="34" rx="17" fill="#2d1824"/>
  <text x="275" y="405" fill="#f48fb1" font-family="Inter, Arial, sans-serif" font-size="14">Theatre</text>
  <rect x="154" y="432" width="112" height="34" rx="17" fill="#161f2c"/>
